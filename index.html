<!DOCTYPE html>
<html lang="zh-CN" data-theme="deep">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
  <title>Guitar Shell</title>

  <!-- PWA / 移动端体验 -->
  <meta name="theme-color" content="#121110">
  <meta name="description" content="吉他手的一站式练琴工作站">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- 主题先落到 html 上，避免浅色模式启动时先闪一下深色 -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('gs_theme');
        var theme = stored === 'light' ? 'light' : 'deep';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#F3EDE3' : '#121110');
      } catch (err) {}
    })();
  </script>

  <!-- 样式与图标（全部相对路径，Pages 子目录 / 本地根目录都能用） -->
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./icon-gShell-32.png" data-theme-favicon data-size="32">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-gShell-192.png" data-theme-favicon data-size="192">
  <link rel="apple-touch-icon" href="./icon-gShell-192.png">
  <link rel="manifest" href="./manifest.json">
</head>

<body>
  <!-- 顶部导航栏 -->
  <header class="app-header">
    <div class="brand"><img class="brand-icon" src="./icon-gShell-192.png" data-theme-icon data-dark-src="./icon-gShell-192.png" data-light-src="./icon-gShell-light-192.png" alt=""> Guitar Shell <button class="version-chip" id="appVersion" type="button" title="点按检查线上版本">v…</button><button class="settings-chip" id="btnGlobalSettings" type="button" aria-label="全局设置" title="全局设置">⚙</button></div>
    <nav class="tabs">
      <button class="tab-btn active" data-target="view-reader">乐谱</button>
      <button class="tab-btn" data-target="view-metronome">节拍器</button>
      <button class="tab-btn" data-target="view-tuner">调音器</button>
      <button class="tab-btn" data-target="view-log">记录</button>
    </nav>
  </header>

  <!-- 核心工作区 -->
  <main class="app-main">
    <!-- 乐谱 -->
    <section id="view-reader" class="view-section active">
      <guitar-sheet-reader></guitar-sheet-reader>
    </section>

    <!-- 节拍器 -->
    <section id="view-metronome" class="view-section">
      <guitar-metronome></guitar-metronome>
    </section>

    <!-- 调音器 -->
    <section id="view-tuner" class="view-section">
      <guitar-tuner></guitar-tuner>
    </section>

    <!-- 练琴记录 -->
    <section id="view-log" class="view-section">
      <guitar-practice-log></guitar-practice-log>
    </section>
  </main>

  <!-- 唯一入口：module 天然 defer，写在 body 末尾即可 -->
  <guitar-settings></guitar-settings>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
